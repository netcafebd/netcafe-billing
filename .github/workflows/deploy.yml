name: Build and Auto Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 3. Install dependencies
        run: npm install --include=dev --prefer-offline --no-audit

      - name: 4. Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:dummy@localhost:5432/dummy?schema=public"

      - name: 5. Build Next.js Production App
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: "postgresql://postgres:dummy@localhost:5432/dummy?schema=public"
          AUTH_SECRET: "dummy-secret-key-for-building-standalone-bundle-32ch"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: 6. Prepare Passenger Restart Trigger
        run: |
          mkdir -p .next/standalone/tmp
          touch .next/standalone/tmp/restart.txt

      - name: 7. Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          local-dir: .next/standalone/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .env
            .env.*
            node_modules/**
            **/node_modules/**
